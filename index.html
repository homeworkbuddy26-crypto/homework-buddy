<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homework Buddy</title><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#FFFCF5;--card:#fff;--ink:#2E1A47;--muted:#6b5f80;--accent:#7C6CF2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1626;--card:#262035;--ink:#f3eefc;--muted:#b9b0cc;--accent:#9d90ff;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
main{max-width:440px;width:100%;text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{margin:16px 0 6px}p{color:var(--muted);margin:0 0 24px}
a{display:block;padding:18px;margin:12px 0;border-radius:16px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:1.1rem;border:2px solid var(--accent)}
a.full{background:var(--accent);color:#fff}
small{display:block;font-weight:400;font-size:.85rem;opacity:.85;margin-top:4px}
</style></head><body><main>
<img src="apple-touch-icon.png" alt="">
<h1>Homework Buddy</h1><p>Your friendly homework reminder</p>
<a class="full" href="full/">Homework Buddy<small>Full version</small></a>
<a href="free/">Homework Buddy Free<small>Free version</small></a>
</main></body></html>
