<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homework Buddy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homework Buddy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8B6CFF">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1ECFF; --bg2:#FFE9F4; --card:#FFFFFF; --ink:#2E1A47; --soft:#6E5A8A;
  --grape:#7B5CFF; --bubble:#FF5FA8; --grape-d:#5B3FD6; --bubble-d:#D63E86; --addtext:#fff; --ring:linear-gradient(160deg,#B9A6FF,#FFB3D6); --alarm2:#3B1F8F; --mint:#1FBF9F; --sun:#FFC23C; --line:#E4DBFA;
  --danger:#FF5C5C; --shadow:0 6px 0 rgba(46,26,71,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1230; --bg2:#2A1636; --card:#2A1F45; --ink:#F6F0FF; --soft:#BBA9DA;
    --line:#3D2F63; --shadow:0 6px 0 rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1230; --bg2:#2A1636; --card:#2A1F45; --ink:#F6F0FF; --soft:#BBA9DA;
  --line:#3D2F63; --shadow:0 6px 0 rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%;
  font-family:"Baloo Bhaijaan 2","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, var(--bg2) 0 180px, transparent 181px),
    radial-gradient(circle at 92% 30%, var(--bg2) 0 120px, transparent 121px),
    radial-gradient(var(--line) 1.5px, transparent 1.6px) 0 0/26px 26px,
    var(--bg);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px;border-radius:12px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px}

/* Header */
.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hello h1{margin:0;font-size:clamp(34px,6vw,56px);line-height:1;font-weight:800;letter-spacing:-.5px}

.jarbox{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:28px;padding:10px 18px 10px 10px;box-shadow:var(--shadow)}
.jarbox svg{width:78px;height:98px}
.jarinfo b{display:block;font-size:30px;line-height:1}
.jarinfo span{font-size:15px;color:var(--soft)}
.jarinfo .lvl{display:inline-block;margin-top:4px;background:var(--sun);color:#3a2600;border-radius:99px;padding:1px 10px;font-weight:700;font-size:14px}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:600;font-size:15px}
.pill.on{background:var(--grape);color:#fff;border-color:var(--grape)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;margin:22px 0 20px;padding:6px;background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.tab{flex:1;padding:12px 6px;border-radius:20px;font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center;justify-content:center;color:var(--soft)}
.tab .ic{font-size:22px}
.tab[aria-selected="true"]{background:var(--grape);color:#fff}
.tab .badge{background:var(--bubble);color:var(--addtext);border-radius:99px;font-size:13px;min-width:22px;padding:0 6px;line-height:22px}

h2{font-size:26px;margin:26px 0 12px;font-weight:800}
h2 small{font-size:16px;color:var(--soft);font-weight:500;margin-left:8px}

/* Big add button */
.addbig{width:100%;display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:28px;background:var(--bubble);color:var(--addtext);font-size:24px;font-weight:800;box-shadow:0 7px 0 var(--bubble-d);transition:transform .08s}
.addbig:active{transform:translateY(4px);box-shadow:0 3px 0 var(--bubble-d)}
.addbig .plus{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--bubble-d);display:grid;place-items:center;font-size:36px;line-height:1}

/* Class strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.cls{flex:0 0 auto;min-width:110px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px 12px;text-align:left;box-shadow:var(--shadow)}
.cls .n{font-size:13px;color:var(--soft);font-weight:600}
.cls .e{font-size:28px;line-height:1.2}
.cls .s{font-weight:700;font-size:16px;white-space:nowrap}
.cls.empty{opacity:.55;border-style:dashed}

/* Homework cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hw{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:26px;padding:14px 14px 14px 12px;box-shadow:var(--shadow);overflow:hidden}
.hw::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--c)}
.hw .emo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 22%,transparent);margin-left:6px}
.hw .sub{font-weight:800;font-size:18px;line-height:1.1}
.hw .txt{font-size:17px;margin:2px 0 6px;overflow-wrap:anywhere;unicode-bidi:plaintext}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;background:var(--bg);border-radius:99px;padding:2px 10px;color:var(--soft)}
.chip.late{background:var(--danger);color:#fff}
.chip.type{background:color-mix(in srgb,var(--c) 18%,var(--bg));color:var(--ink)}
.chip.exam{background:var(--grape);color:#fff}
.chip.today{background:var(--sun);color:#3a2600}
.check{width:52px;height:52px;border-radius:50%;border:4px solid var(--c);display:grid;place-items:center;font-size:26px;color:transparent;transition:transform .1s}
.check:active{transform:scale(.9)}
.hw.isdone .check{background:var(--mint);border-color:var(--mint);color:#fff}
.hw.isdone .txt{text-decoration:line-through;opacity:.7}
.editbtn{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:4px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;color:var(--ink)}
.editbtn:active{transform:scale(.95)}
.cardbtns{display:flex;gap:8px;flex-wrap:wrap}
.editbtn.del{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.hw .check{margin-top:10px}

.empty-state{text-align:center;padding:36px 20px;background:var(--card);border:3px dashed var(--line);border-radius:28px;color:var(--soft);font-size:19px}
.empty-state .big{font-size:56px}

/* Schedule grid */
.gridwrap{overflow-x:auto;border-radius:26px}
.sched{display:grid;grid-template-columns:70px repeat(5,minmax(120px,1fr));gap:8px;min-width:720px}
.sched .hd{text-align:center;font-weight:800;font-size:18px;padding:8px;border-radius:18px;background:var(--card);border:3px solid var(--line)}
.sched .hd.now{background:var(--grape);color:#fff;border-color:var(--grape)}
.sched .pn{display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--soft)}
.cell{min-height:82px;border-radius:20px;border:3px dashed var(--line);background:color-mix(in srgb,var(--card) 60%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6px;text-align:center;font-weight:700;font-size:15px;position:relative}
.cell.set{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.cell .e{font-size:28px;line-height:1.1}
.cell .dot{position:absolute;top:6px;right:8px;background:var(--bubble);color:#fff;border-radius:99px;font-size:12px;min-width:20px;line-height:20px}
.cell .addhint{color:var(--soft);font-size:24px}
.hintline{color:var(--soft);font-size:16px;margin:0 0 12px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(30,15,55,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:min(640px,100%);max-height:calc(100% - 30px);overflow:auto;background:var(--card);border-radius:34px 34px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.9,.3,1.2)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:34px}}
.sheet h3{margin:0 0 14px;font-size:28px;font-weight:800}
.lbl{font-weight:700;font-size:16px;color:var(--soft);margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:3px solid var(--line);border-radius:18px;padding:8px 14px;font-weight:700;font-size:16px;background:var(--card)}
.opt small{display:block;font-size:12px;color:var(--soft);font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--grape);background:var(--grape);color:#fff}
.opt[aria-pressed="true"] small{color:#E9E2FF}
textarea,.field{width:100%;border:3px solid var(--line);border-radius:20px;padding:12px 16px;font-size:19px;background:var(--bg);outline:none}
textarea:focus,.field:focus{border-color:var(--grape)}
textarea{min-height:96px;resize:vertical;unicode-bidi:plaintext}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btns{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:14px;border-radius:20px;font-weight:800;font-size:19px;background:var(--bg);border:3px solid var(--line)}
.btn.main{background:var(--grape);color:#fff;border-color:var(--grape);box-shadow:0 5px 0 var(--grape-d)}
.btn.pink{background:var(--bubble);color:var(--addtext);border-color:var(--bubble);box-shadow:0 5px 0 var(--bubble-d)}
.btn.green{background:var(--mint);color:#fff;border-color:var(--mint);box-shadow:0 5px 0 #14937A}
.btn.red{color:var(--danger);border-color:var(--danger)}
.note{font-size:14px;color:var(--soft);margin-top:10px}
.subjbtn{border:3px solid var(--line);border-radius:18px;padding:6px 12px;font-weight:700;display:flex;gap:6px;align-items:center;background:var(--card)}
.subjbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 25%,var(--card))}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{font-size:26px;width:46px;height:46px;border-radius:14px;border:3px solid transparent}
.emojis button[aria-pressed="true"]{border-color:var(--grape);background:var(--bg)}

/* Alarm */
.alarm{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:radial-gradient(circle,var(--grape),var(--alarm2));animation:fade .2s}
.alarm .box{background:var(--card);border-radius:40px;padding:30px 26px;max-width:520px;width:100%;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.2)}
.alarm .ring{font-size:92px;display:inline-block;animation:wiggle .5s ease-in-out infinite}
.alarm h3{font-size:34px;margin:6px 0 4px;line-height:1.1}
.alarm p{font-size:21px;margin:0 0 6px;unicode-bidi:plaintext}
.alarm .btns{flex-direction:column}

/* Splash */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:linear-gradient(160deg,#7B5CFF,#FF5FA8);color:#fff;padding:20px}
.splash .star{font-size:120px;display:inline-block;animation:pulse 1.4s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15))}
.splash h1{font-size:clamp(40px,8vw,64px);margin:6px 0 0;line-height:1}
.splash p{font-size:22px;margin:10px 0 0;opacity:.9}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 20px;border-radius:99px;font-weight:700;z-index:60;animation:up .2s}
/* Unicorn buddy */
.top{grid-template-columns:auto 1fr auto}
.uni{width:118px;height:118px;flex:0 0 auto;border-radius:50%;background:var(--ring);border:4px solid var(--card);box-shadow:var(--shadow);overflow:hidden;padding:6px 4px 0}
.uni svg{width:100%;height:100%;display:block;transform-origin:50% 90%}
.uni.happy svg{animation:hop .5s ease 2}
.bubble{position:relative;display:inline-block;margin-top:10px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:8px 16px;font-size:18px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-12px;top:14px;border:8px solid transparent;border-right:12px solid var(--line)}
.bubble b{color:var(--grape-t)}
.bigUni{width:150px;height:150px;margin:0 auto;display:block}
.bigUni svg{width:100%;height:100%}
.alarm .bigUni,.empty-state .bigUni{border-radius:50%;background:var(--ring);overflow:hidden;padding:10px 6px 0}
.alarm .bigUni svg{animation:wiggle .5s ease-in-out infinite;transform-origin:50% 90%}
.splash .bigUni{width:210px;height:210px;animation:pulse 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.15))}
/* Rewards */
.rw{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px 18px;box-shadow:var(--shadow)}
.rw .t{display:flex;gap:12px;align-items:center;font-weight:800;font-size:21px}
.rw .t .e{font-size:38px}
.rw .t span[dir]{unicode-bidi:plaintext}
.bar{position:relative;height:30px;border-radius:99px;background:var(--bg);margin:14px 0 6px;border:3px solid var(--line);overflow:visible}
.bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#FF5FA8,#FFC23C,#1FBF9F,#7BD3FF,#A66CFF);transition:width .6s}
.bar .run{position:absolute;top:50%;width:46px;height:46px;transform:translate(-50%,-55%);transition:left .6s}
.bar .run svg{width:100%;height:100%}
.bar .goal{position:absolute;right:-6px;top:50%;transform:translateY(-50%);font-size:28px}
.rw .meta{color:var(--soft);font-weight:600;font-size:16px}
.rw.ready{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 16%,var(--card))}
.rw.given{opacity:.7}
.nextrw{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 16px;border-radius:22px;background:var(--card);border:3px solid var(--line);font-weight:700;font-size:17px;width:100%;text-align:left}
.nextrw .e{font-size:30px}
.pinput{letter-spacing:14px;text-align:center;font-size:32px}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.pr .e{font-size:28px}.pr .x{flex:1;font-weight:700}
.pr .x small{display:block;color:var(--soft);font-weight:600}
.pr .btn{flex:0 0 auto;padding:8px 12px;font-size:15px}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}}
@media (max-width:640px){.top{grid-template-columns:auto 1fr}.top>div:last-child{grid-column:1/-1}.uni{width:84px;height:84px}}
.codebox{font-size:40px;font-weight:800;letter-spacing:3px;text-align:center;background:var(--bg);border:3px dashed var(--grape);border-radius:24px;padding:14px;margin:10px 0;direction:ltr;user-select:all}
.syncok{color:var(--mint);font-weight:800}
.subrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.subrow .e{font-size:28px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.subrow .x{flex:1;font-weight:700;font-size:18px;unicode-bidi:plaintext}
.subrow .x small{display:block;color:var(--soft);font-weight:600;font-size:13px}
.mini{padding:6px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.mini.red{color:var(--danger);border-color:var(--danger)}
.linkbtn{margin-top:10px;font-weight:700;color:var(--grape-t);font-size:16px;padding:4px 0}
.splash{background:#FFFCF5 !important;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 37px,#DCE3FF 37px,#DCE3FF 39px) !important;color:#22304F !important;display:flex !important;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.splash::before{content:"";position:absolute;left:7%;top:0;bottom:0;width:3px;background:#F9A8BE}
.splash .blob{position:absolute;border-radius:50%}
.splash .deco{position:absolute;width:62px;height:62px;border-radius:20px;border:4px solid #fff;box-shadow:0 6px 0 rgba(16,35,63,.08);display:grid;place-items:center;font-size:30px}
.splash .nbw{position:relative;width:min(320px,62vw);aspect-ratio:1;border-radius:50%;background:#fff;border:6px dashed #F9B8C9;display:grid;place-items:center;animation:pulse 2.4s ease-in-out infinite}
.splash .nbw svg{width:86%;height:auto}
.splash h1{position:relative;margin:4px 0 0;font-size:clamp(42px,9vw,64px);line-height:1;color:#22304F}
.splash h1 span{color:#F2668B}
.splash p{position:relative;margin:0;font-size:clamp(18px,3.4vw,23px);font-weight:600;color:#5B6485}
.splash .schips{position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.splash .schips span{background:#fff;border:3px solid #DCE3FF;border-radius:99px;padding:5px 14px;font-weight:700;font-size:16px;color:#22304F}
#startBtn{position:relative;margin-top:10px;display:inline-flex;align-items:center;gap:14px;border-radius:99px;padding:16px 40px 16px 18px;background:#7C6CF2;color:#fff;font-size:28px;font-weight:800;box-shadow:0 8px 0 #5B4BD0}
#startBtn:active{transform:translateY(4px);box-shadow:0 4px 0 #5B4BD0}
#startBtn .pl{width:48px;height:48px;border-radius:50%;background:#FFD43B;display:grid;place-items:center;color:#22304F;font-size:22px}
.buddies{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bcard{border:4px solid var(--line);border-radius:26px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card)}
.bcard[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card))}
.bcard .m{width:112px;height:112px;border-radius:50%;overflow:hidden;background:var(--r);padding:8px 5px 0}
.bcard .m svg{width:100%;height:100%;display:block}
.bcard b{font-size:22px}
.bcard .sw{display:flex;gap:5px}.bcard .sw i{width:20px;height:20px;border-radius:7px;display:block}
.bcard small{font-weight:700;color:var(--soft)}
.gbtn{flex:1;border:4px solid var(--line);border-radius:24px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);font-size:20px;font-weight:800}
.gbtn[aria-pressed="true"]{border-color:#7C6CF2;background:color-mix(in srgb,#7C6CF2 16%,var(--card))}
.gbtn .ms{display:flex;gap:4px}
.gbtn .ms span{width:50px;height:50px;border-radius:50%;overflow:hidden;padding:4px 3px 0;border:3px solid #fff}
.gbtn .ms svg{width:100%;height:100%;display:block}
.kidbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 -6px}
.kidchip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:99px;border:3px solid var(--line);background:var(--card);font-weight:800;font-size:17px;box-shadow:var(--shadow)}
.kidchip[aria-pressed="true"]{border-color:var(--grape);background:var(--grape);color:#fff}
.kidchip.add{padding:5px 16px;font-size:22px;color:var(--soft)}
.kidrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.kidrow .x{flex:1;font-weight:800;font-size:19px;unicode-bidi:plaintext}
.kidrow .x small{display:block;color:var(--soft);font-weight:600;font-size:13px}
.langbtns{display:flex;gap:10px}
.langbtns .opt{flex:1;text-align:center;font-size:19px;padding:10px}
[dir="rtl"] .hw::before{inset:0 0 0 auto}
[dir="rtl"] .hw{padding:14px 12px 14px 14px}
[dir="rtl"] .bubble::before{left:auto;right:-12px;border-right-color:transparent;border-left:12px solid var(--line)}
[dir="rtl"] .cls,[dir="rtl"] .nextrw{text-align:right}

const isDark=()=>!!(darkMQ&&darkMQ.matches);
if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',()=>{applyTheme();render()});
function applyTheme(){
  const id=themeId(),t=TH(),r=document.documentElement,dk=isDark();
  const light={'--card':'#FFFFFF','--grape-t':t.vars['--grape']};
  const v=Object.assign({},t.vars,light,dk?(DARK[id]||DARK.luna):{});
  Object.entries(v).forEach(([k,x])=>r.style.setProperty(k,x));
  r.style.colorScheme=dk?'dark':'light';
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',dk?v['--bg']:t.meta);
  const u=$('#uniHead');if(u&&u.dataset.th!==id){u.innerHTML=MASCOT();u.dataset.th=id}
}
function miniBuddy(id,size){const t=THEMES[id];return `<span style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;display:block;background:${t.vars['--ring']};padding:${Math.round(size*.07)}px ${Math.round(size*.04)}px 0">${svgOf(id)}</span>`}
function setTheme(id){
  const prev=themeId();
  if(state.pet&&state.pet===THEMES[prev].pet)state.pet='';
  state.theme=id;state.gender=THEMES[id].gender;save();applyTheme();render();
}
function buddySheet(gender,after,sticky){
  const ids=Object.keys(THEMES).filter(k=>!gender||THEMES[k].gender===gender);
  let pick=ids.includes(state.theme)?state.theme:ids[0];
  const card=id=>{const t=THEMES[id];return `<button class="bcard" data-b="${id}" aria-pressed="${id===pick}" style="--c:${t.vars['--grape']};--cb:${t.vars['--bg']};--r:${t.vars['--ring']}">
    <span class="m">${svgOf(id)}</span><b>${t.pet}</b><span class="sw">${t.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span>
    <small>Collect ${t.word.split(' ')[0]} ${t.emoji}</small></button>`};
  openSheet(`<h3 style="text-align:center">Pick your buddy! ✨</h3>
    <p style="text-align:center;font-size:17px;color:var(--soft);margin:-6px 0 12px">Your buddy reminds you about homework and cheers you on.</p>
    ${gender?`<div class="buddies">${ids.map(card).join('')}</div>`
      :`<div class="lbl">For girls</div><div class="buddies">${['luna','daisy'].map(card).join('')}</div><div class="lbl">For boys</div><div class="buddies">${['bolt','kicko'].map(card).join('')}</div>`}
    <p class="note" style="text-align:center">You can change your buddy later in Settings.</p>
    <button class="btn main" id="go" style="width:100%;margin-top:6px">Let’s go with ${THEMES[pick].pet}!</button>
    ${sticky?'':'<div class="btns"><button class="btn" id="cancel">Cancel</button></div>'}`,
  (el,close)=>{
    el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{pick=b.dataset.b;el.querySelectorAll('[data-b]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));el.querySelector('#go').textContent=`Let’s go with ${THEMES[pick].pet}!`;playTune('bubbles')});
    if(!sticky)el.querySelector('#cancel').onclick=close;
    el.querySelector('#go').onclick=()=>{setTheme(pick);close();hop();celebrate();speak(`Hi ${nm()}! I'm ${petName()}!`);if(after)after()};
  },sticky);
}

function trText(v){
  const k=v.trim();if(!k)return null;
  if(AR[k]!==undefined)return v.replace(k,AR[k]);
  for(const [re,fn] of AR_PAT){const m=k.match(re);if(m){const o=fn(m);if(o!=null)return v.replace(k,o)}}
  let m=k.match(/^([^\p{L}\p{N}]+)\s*(.+)$/u);
  if(m){const r=trText(m[2]);if(r!=null)return v.replace(k,m[1].trimEnd()+' '+r.trim())}
  m=k.match(/^(.+?)\s*([^\p{L}\p{N}“”()]+)$/u);
  if(m){const r=trText(m[1]);if(r!=null)return v.replace(k,r.trim()+' '+m[2].trimStart())}
  return null;
}
const trSkip=el=>!el||/^(SCRIPT|STYLE|TEXTAREA)$/.test(el.nodeName)||(el.closest&&el.closest('[data-nt]'));
function trNode(n,ar){
  if(trSkip(n.parentElement))return;
  if(ar){if(n.__ar===n.nodeValue)return;const o=trText(n.nodeValue);if(o!=null&&o!==n.nodeValue){n.__en=n.nodeValue;n.__ar=o;n.nodeValue=o}}
  else if(n.__en!=null&&n.nodeValue===n.__ar){n.nodeValue=n.__en;n.__ar=null}
}
function trAttrs(el,ar){
  if(!el.getAttribute||(el.closest&&el.closest('[data-nt]')))return;
  ['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a);if(v==null)return;const key='en'+a.replace('-','');
    if(ar){if(el.dataset[key+'Ar']===v)return;const o=trText(v);if(o!=null&&o!==v){el.dataset[key]=v;el.dataset[key+'Ar']=o;el.setAttribute(a,o)}}
    else if(el.dataset[key]!=null&&el.dataset[key+'Ar']===v){el.setAttribute(a,el.dataset[key]);delete el.dataset[key+'Ar']}});
}
function translateTree(root,ar){
  if(ar===undefined)ar=state.lang==='ar';
  if(root.nodeType===3){trNode(root,ar);return}
  if(root.nodeType!==1)return;
  trAttrs(root,ar);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)trNode(n,ar);else trAttrs(n,ar)}
}
function applyLang(){
  const ar=state.lang==='ar',r=document.documentElement,want=ar?'ar':'en';
  if(r.lang!==want){r.lang=want;r.dir=ar?'rtl':'ltr';translateTree(document.body,ar)}
}
new MutationObserver(ms=>{if(!state||state.lang!=='ar')return;
  for(const m of ms){if(m.type==='characterData')trNode(m.target,true);else if(m.type==='attributes')trAttrs(m.target,true);else m.addedNodes.forEach(n=>translateTree(n,true))}
}).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});

/* ---------- Sound & voice ---------- */
function unlockAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const b=audioCtx.createBuffer(1,1,22050),s=audioCtx.createBufferSource();s.buffer=b;s.connect(audioCtx.destination);s.start(0);
  }catch(e){}
}
function tone(f,t,dur,type='sine',vol=.35){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur+.05);
}
const TUNES={
  chime:{name:'Magic chime ✨',notes:[[1047,0],[1319,.15],[1568,.3],[2093,.45],[1568,.7],[2093,.85]],type:'sine',d:.7},
  xylo:{name:'Xylophone 🎶',notes:[[784,0],[880,.14],[988,.28],[1175,.42],[988,.62],[1175,.76],[1568,.9]],type:'triangle',d:.45},
  bubbles:{name:'Bubble pop 🫧',notes:[[600,0],[900,.12],[700,.24],[1100,.36],[800,.48],[1300,.6]],type:'sine',d:.18}
};
function playTune(name,times=1){
  if(!audioCtx)return;if(audioCtx.state==='suspended')audioCtx.resume();
  const t=TUNES[name]||TUNES.chime;
  for(let r=0;r<times;r++){
    const base=audioCtx.currentTime+.05+r*1.9;
    t.notes.forEach(([f,o])=>{tone(f,base+o,t.d,t.type);tone(f*2,base+o,t.d*.6,'sine',.08)});
  }
}
function yay(){
  if(!audioCtx)return;const b=audioCtx.currentTime+.02;
  [523,659,784,1047].forEach((f,i)=>tone(f,b+i*.09,.35,'triangle',.3));
}
function speak(text){
  if(!state.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const ar=state.lang==='ar';const u=new SpeechSynthesisUtterance(ar?trSpeech(text):text);u.lang=ar?'ar-SA':'en-US';u.pitch=1.35;u.rate=.95;speechSynthesis.speak(u)}catch(e){}
}

function openSheet(html,mount,sticky){
  const sc=document.createElement('div');sc.className='scrim';
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  if(!sticky)sc.addEventListener('click',e=>{if(e.target===sc)sc.remove()});
  document.body.appendChild(sc);mount&&mount(sc.querySelector('.sheet'),()=>sc.remove());
}
function press(group,btn){group.querySelectorAll('[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed','false'));btn.setAttribute('aria-pressed','true')}

function dueOptions(){
  const n=new Date();
  return [{k:key(n),t:'Today'},{k:key(addDays(n,1)),t:'Tomorrow'},{k:key(addDays(n,2)),t:'Day after'}];
}
function defaultRemDay(due){
  const k=due===todayK()?due:key(addDays(fromKey(due),-1));
  return k<todayK()?todayK():k;
}
function remindTs(dayK,time='16:00'){
  const rd=fromKey(dayK);const [hh,mm]=time.split(':').map(Number);rd.setHours(hh,mm,0,0);
  if(rd.getTime()<Date.now()){const n=new Date(Date.now()+2*6e4);n.setSeconds(0,0);return n.getTime()}
  return rd.getTime();
}

function subjectUse(id){

}

    <div class="lbl">Reminder sound</div><div class="opts" id="sO">${Object.entries(TUNES).map(([k,t])=>`<button class="opt" data-t="${k}" aria-pressed="${k===state.sound}">${t.name}</button>`).join('')}</div>
    <div class="lbl">Talking reminder</div><div class="opts" id="vO"><button class="opt" data-v="1" aria-pressed="${state.voice}">🗣️ On</button><button class="opt" data-v="0" aria-pressed="${!state.voice}">🔇 Off</button></div>
    <div class="lbl">Children</div><button class="btn" id="kids" style="width:100%">👨‍👩‍👧‍👦 Children: add or remove 🔒</button>
    <div class="lbl">Account</div><button class="btn" id="acct" style="width:100%">${licOK()?'🔑 Activated ✓ · Account & sync 🔒':'🔑 Activate Homework Buddy'}</button>
    <div class="btns"><button class="btn pink" id="test">Test the alarm 🔔</button><button class="btn main" id="ok">Done</button></div>
    <p class="note">For alarms to ring, keep this page open on the iPad with the volume up and the side switch off silent. Tap “Keep awake” so the screen doesn’t turn off.</p>`,
  (el,close)=>{
    el.querySelector('#pO').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;state.periods=+b.dataset.n;press(el.querySelector('#pO'),b);DAYS.forEach(d=>{while(state.schedule[d.i].length<state.periods)state.schedule[d.i].push(null)});save()};
    el.querySelector('#sO').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;state.sound=b.dataset.t;press(el.querySelector('#sO'),b);playTune(state.sound);save()};
    el.querySelector('#vO').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;state.voice=b.dataset.v==='1';press(el.querySelector('#vO'),b);save()};
    el.querySelector('#acct').onclick=()=>{close();licOK()?pinGate(accountSheet):activationSheet(lic&&lic.status==='invalid'?'invalid':'manual')};
    el.querySelector('#lgS').onclick=e=>{const b=e.target.closest('[data-lg]');if(!b)return;state.lang=b.dataset.lg;press(el.querySelector('#lgS'),b);save();applyLang();render()};
    el.querySelector('#kids').onclick=()=>{close();pinGate(childrenSheet)};
    el.querySelector('#buddy').onclick=()=>{close();buddySheet('')};
    el.querySelector('#subs').onclick=()=>{close();subjectsSheet()};
    el.querySelector('#test').onclick=()=>{playTune(state.sound,2);speak(`${nm()}! It's homework time!`)};
    el.querySelector('#ok').onclick=()=>{const n=el.querySelector('#nm').value.trim();if(n)state.name=n;const pn=el.querySelector('#pn').value.trim();state.pet=(pn&&pn!==TH().pet)?pn:'';save();close();render()};
  });
}

/* ---------- Done / confetti ---------- */
function toggleDone(id){
  const h=state.hw.find(x=>x.id===id);if(!h)return;
  if(!h.done){h.done=true;h.doneAt=Date.now();state.stars++;save();render();celebrate();
    const praise=['Great job','Awesome','You did it','Super star','Well done'][Math.floor(Math.random()*5)];
    toast(`${praise}, ${nm()}! +1 ${TH().emoji}`);speak(`${praise}, ${nm()}!`);
    if(state.stars%5===0)setTimeout(()=>toast(`New level: ${level(state.stars)}`),1600);
    hop();checkRewards();
  }else{h.done=false;h.doneAt=null;state.stars=Math.max(0,state.stars-1);h.nextAlert=Math.max(h.remindAt,Date.now()+6e4);save();render()}
}
function celebrate(){
  yay();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#FF5FA8','#7B5CFF','#1FBF9F','#FFC23C','#2D9CDB'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,s:6+Math.random()*8,c:cols[Math.random()*5|0],r:Math.random()*6,star:Math.random()<.3}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
    if(p.star){x.font=`${p.s*2}px sans-serif`;x.fillText('★',0,0)}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
function confirmDelete(h){
  const L=hwLook(h);
  openSheet(`<div style="text-align:center"><span class="bigUni" style="width:110px;height:110px;border-radius:50%;background:var(--ring);overflow:hidden;padding:8px 5px 0">${MASCOT()}</span>
    <h3 style="margin-top:10px">Delete this homework?</h3>
    <p style="font-size:19px;margin:0 0 4px" dir="auto"><b>${L.emoji} ${esc(L.title)}</b></p>
    ${h.text?`<p style="font-size:17px;color:var(--soft);margin:0" dir="auto">${esc(h.text)}</p>`:''}
    ${h.done?`<p class="note">Don’t worry, you keep your star ⭐</p>`:''}</div>
    <div class="btns"><button class="btn" id="cancel">No, keep it</button><button class="btn red" id="yes" style="background:var(--danger);color:#fff">🗑️ Yes, delete</button></div>`,
  (el,close)=>{
    el.querySelector('#cancel').onclick=close;
    el.querySelector('#yes').onclick=()=>{state.hw=state.hw.filter(x=>x.id!==h.id);save();close();render();toast('Homework deleted')};
  });
}
function hop(){const u=$('#uniHead');u.classList.remove('happy');void u.offsetWidth;u.classList.add('happy')}
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---------- Alarms ---------- */
function alarmKidIds(){let m='all';try{m=localStorage.getItem(ALARM_KEY)||'all'}catch(e){}
  return m!=='all'&&fam.kids[m]?[m]:fam.order.filter(id=>fam.kids[id])}
function checkAlarms(){
  if(alerting||$('#splash'))return;
  const now=Date.now();let best=null,bk=null;
  alarmKidIds().forEach(id=>(fam.kids[id].hw||[]).forEach(x=>{if(!x.done&&x.nextAlert&&x.nextAlert<=now&&(!best||x.nextAlert<best.nextAlert)){best=x;bk=id}}));
  if(!best)return;
  if(bk!==activeId){document.querySelectorAll('.scrim').forEach(x=>x.remove());useKid(bk);render()}
  showAlarm(best);
}
function showAlarm(h){
  alerting=h.id;h.nextAlert=Date.now()+10*6e4;save();
  const L=hwLook(h),T=typ(h.type);
  const a=document.createElement('div');a.className='alarm';a.setAttribute('role','alertdialog');
  a.innerHTML=`<div class="box"><span class="bigUni">${MASCOT()}</span>
    <h3>${esc(nm())}! It’s ${T.exam?'study':h.type==='other'?'task':'homework'} time! ⏰</h3>
    <p><b dir="auto">${L.emoji} ${h.type==='other'?esc(L.title)+(L.subject?' · '+esc(L.subject):''):esc(L.title)+' '+T.name}</b></p>
    <p dir="auto" data-nt>${esc(h.text)}</p>
    <p style="color:var(--soft);font-size:17px">Needed ${relDay(h.due).toLowerCase()}</p>
    <div class="btns">
      <button class="btn green" id="aDone">I finished it! ⭐</button>
      <button class="btn main" id="aStart">I’m starting now 💪</button>
      <button class="btn" id="aSnooze">Remind me in 10 minutes</button>
      <button class="btn" id="aEdit">✏️ Change time or details</button>
    </div></div>`;
  document.body.appendChild(a);
  playTune(state.sound,3);
  setTimeout(()=>speak(h.type==='other'
    ?(hasArabic(L.title)?`${nm()}! It's time for your task!`:`${nm()}! Time for your task: ${L.title}!`)
    :`${nm()}! It's time to ${T.say} ${hasArabic(L.title)?'':L.title+' '}${T.word}!`),1800);
  const close=()=>{a.remove();alerting=null;speechSynthesis&&speechSynthesis.cancel()};
  a.querySelector('#aDone').onclick=()=>{close();toggleDone(h.id)};
  a.querySelector('#aStart').onclick=()=>{h.nextAlert=Date.now()+30*6e4;save();close();render();toast('You got this! I’ll check again in 30 minutes 💪')};
  a.querySelector('#aEdit').onclick=()=>{close();hwSheet({edit:h})};
  a.querySelector('#aSnooze').onclick=()=>{h.nextAlert=Date.now()+10*6e4;save();close();render();toast('Okay! Back in 10 minutes ⏰')};
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('tab')){view=t.dataset.v;render();scrollTo({top:0,behavior:'smooth'});return}
  if(t.id==='addBtn')return hwSheet();
  if(t.id==='setBtn')return settingsSheet();
  if(t.id==='wakeBtn')return toggleWake();
  if(t.dataset.kid)return switchKid(t.dataset.kid);
  if(t.id==='addKid')return pinGate(addChild);
  if(t.id==='manageKids')return pinGate(childrenSheet);
  if(t.id==='parentBtn')return pinGate(parentPanel);
  if(t.id==='trialBtn')return activationSheet(lic&&lic.status==='invalid'?'invalid':trialLeft()?'manual':'limit');
  if(t.id==='syncPill'){syncNow().then(()=>toast(syncErr?'⚠️ '+syncErr:'Synced ✓'));return}
  if(t.id==='uniHead'){hop();const m=CHEERS[Math.random()*CHEERS.length|0];$('#sub').textContent=m;playTune('bubbles');speak(m.replace(/[^\w\s!’']/g,''));setTimeout(header,5000);return}
  if(t.dataset.done)return toggleDone(t.dataset.done);
  if(t.dataset.del){const h=state.hw.find(x=>x.id===t.dataset.del);if(h)confirmDelete(h);return}
  if(t.dataset.edit){const h=state.hw.find(x=>x.id===t.dataset.edit);if(h)hwSheet({edit:h});return}
  if(t.dataset.go){view=t.dataset.go;render();return}
  if(t.dataset.cls){const[d,p]=t.dataset.cls.split('-').map(Number);return hwSheet({day:d,period:p})}
  if(t.dataset.cell){const[d,p]=t.dataset.cell.split('-').map(Number);return cellSheet(d,p)}
});
document.addEventListener('pointerdown',unlockAudio,{passive:true});
$('#startBtn').onclick=()=>{unlockAudio();playTune('chime');$('#splash').remove();if(!state.name){onboarding();return}speak(`Hi ${nm()}! Let's check your homework.`);setTimeout(checkAlarms,1500)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();checkAlarms();syncNow();if($('#wakeBtn').classList.contains('on')&&!wakeLock)toggleWake()}});

/* ---------- Start ---------- */
loadLocal();prune();render();initCloud();
setInterval(checkAlarms,10000);
setInterval(header,60000);
</script>
